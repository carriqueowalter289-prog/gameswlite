<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamesWLite XP</title>

<style>

body{
    margin:0;
    font-family:Tahoma;
    background:url('https://wallpapercave.com/wp/wp2757874.jpg');
    background-size:cover;
    overflow:hidden;
}

/* ICONOS */

.desktop{
    padding:20px;
}

.icon{
    width:90px;
    text-align:center;
    color:white;
    margin-bottom:25px;
    cursor:pointer;
    text-shadow:1px 1px 3px black;
}

.icon img{
    width:48px;
}

.icon:hover{
    background:rgba(255,255,255,0.2);
    border:1px solid white;
}

/* VENTANAS */

.window{
    width:700px;
    height:420px;
    background:#ECE9D8;
    position:absolute;
    top:70px;
    left:140px;
    border:3px solid #245EDB;
    border-radius:8px;
    box-shadow:0 0 25px black;
    display:none;
}

.titlebar{
    background:linear-gradient(to right,#0058EE,#3A93FF);
    color:white;
    padding:8px;
    font-weight:bold;
}

.content{
    padding:10px;
    height:360px;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* TASKBAR */

.taskbar{
    position:fixed;
    bottom:0;
    width:100%;
    height:42px;
    background:linear-gradient(to bottom,#245EDB,#1941A5);
    display:flex;
    align-items:center;
}

.start{
    background:green;
    color:white;
    padding:8px 18px;
    margin-left:5px;
    border-radius:10px;
    font-weight:bold;
    box-shadow:inset 0 0 5px rgba(255,255,255,0.5);
}

.clock{
    margin-left:auto;
    color:white;
    margin-right:20px;
}

</style>
</head>

<body>

<div class="desktop">

<div class="icon" onclick="openWindow('friv')">
<img src="https://cdn-icons-png.flaticon.com/512/732/732228.png">
<div>Friv</div>
</div>

<div class="icon" onclick="openWindow('y8')">
<img src="https://cdn-icons-png.flaticon.com/512/5968/5968350.png">
<div>Y8</div>
</div>

<div class="icon" onclick="openWindow('youtube')">
<img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
<div>YouTube</div>
</div>

<div class="icon" onclick="openWindow('game')">
<img src="https://cdn-icons-png.flaticon.com/512/686/686589.png">
<div>Mini Juego</div>
</div>

</div>

<!-- VENTANA -->

<div class="window" id="window">

<div class="titlebar">
GamesWLite XP
</div>

<div class="content" id="content">

</div>

</div>

<!-- TASKBAR -->

<div class="taskbar">

<div class="start">
Inicio
</div>

<div class="clock" id="clock">
00:00
</div>

</div>

<script>

function openWindow(type){

document.getElementById("window").style.display="block";

let content=document.getElementById("content");

if(type=="friv"){
content.innerHTML=`<iframe src="https://www.friv.com"></iframe>`;
}

if(type=="y8"){
content.innerHTML=`<iframe src="https://www.y8.com"></iframe>`;
}

if(type=="youtube"){
content.innerHTML=`<iframe src="https://www.youtube.com"></iframe>`;
}

if(type=="game"){

content.innerHTML=`

<canvas id="gameCanvas" width="600" height="300" style="background:black;"></canvas>

`;

setTimeout(startGame,100);

}

}

function updateClock(){

let now=new Date();

let h=now.getHours().toString().padStart(2,'0');
let m=now.getMinutes().toString().padStart(2,'0');

document.getElementById("clock").innerHTML=h+":"+m;

}

setInterval(updateClock,1000);

updateClock();

/* MINI JUEGO */

function startGame(){

const canvas=document.getElementById("gameCanvas");

if(!canvas)return;

const ctx=canvas.getContext("2d");

let x=50;

let speed=4;

document.addEventListener("keydown",(e)=>{

if(e.key=="ArrowRight")x+=speed;
if(e.key=="ArrowLeft")x-=speed;

});

function draw(){

ctx.clearRect(0,0,600,300);

ctx.fillStyle="lime";

ctx.fillRect(x,220,50,50);

ctx.fillStyle="white";

ctx.font="20px Arial";

ctx.fillText("Usa ← y →",20,30);

requestAnimationFrame(draw);

}

draw();

}

</script>

</body>
</html>
